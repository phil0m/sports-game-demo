<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BUZZER // Clutch Shot</title>
<style>
  :root{
    --bg:#06080d;
    --panel:#0b1018;
    --line:#1c2735;
    --cyan:#2de3ff;
    --orange:#ff7a1a;
    --red:#ff3b5c;
    --green:#38ffab;
    --text:#d9e6f2;
    --dim:#5c7187;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 50% 0%, #0d1726 0%, #06080d 55%),
      var(--bg);
    color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100%;
    overflow:hidden;
    touch-action:manipulation;
    user-select:none;
  }

  .scanlines{
    position:fixed; inset:0; pointer-events:none; z-index:5;
    background:repeating-linear-gradient(
      to bottom, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px,
      transparent 1px, transparent 3px
    );
    mix-blend-mode:overlay;
  }

  .wrap{
    width:100%;
    max-width:460px;
    padding:18px;
  }

  .frame{
    background:linear-gradient(180deg,var(--panel),#070a10);
    border:1px solid var(--line);
    border-radius:18px;
    padding:20px 18px 24px;
    box-shadow:0 0 0 1px rgba(45,227,255,0.04), 0 20px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.03);
    position:relative;
  }

  .frame::before{
    content:"";
    position:absolute; inset:0;
    border-radius:18px;
    padding:1px;
    background:linear-gradient(135deg, rgba(45,227,255,0.35), transparent 30%, transparent 70%, rgba(255,122,26,0.3));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events:none;
  }

  header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px;
  }
  .logo{
    font-weight:800; letter-spacing:3px; font-size:13px; color:var(--cyan);
    text-shadow:0 0 12px rgba(45,227,255,0.6);
  }
  .logo span{color:var(--orange); text-shadow:0 0 12px rgba(255,122,26,0.6);}

  .stats{display:flex; gap:14px; font-size:11px; color:var(--dim); letter-spacing:1px;}
  .stats b{display:block; font-size:18px; color:var(--text); font-variant-numeric:tabular-nums;}
  .stats .hi b{color:var(--orange);}

  .court{
    position:relative;
    height:230px;
    border-radius:14px;
    background:
      radial-gradient(ellipse at 50% 120%, rgba(45,227,255,0.10), transparent 60%),
      linear-gradient(180deg, #0a1018, #060910);
    border:1px solid var(--line);
    overflow:hidden;
    margin-bottom:16px;
  }
  .hoop{
    position:absolute; top:28px; left:50%; transform:translateX(-50%);
    width:70px; height:18px;
  }
  .rim{
    width:100%; height:8px; border-radius:50%;
    border:3px solid var(--orange);
    box-shadow:0 0 16px rgba(255,122,26,0.65);
  }
  .net{
    position:absolute; top:6px; left:10%; width:80%; height:26px;
    background:repeating-linear-gradient(90deg, rgba(217,230,242,0.5) 0 1px, transparent 1px 7px);
    clip-path:polygon(0 0,100% 0,78% 100%,22% 100%);
    opacity:0.6;
  }
  .ball{
    position:absolute; left:50%; bottom:14px;
    width:34px; height:34px; margin-left:-17px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffb066, var(--orange) 60%, #c4530a);
    box-shadow:0 0 14px rgba(255,122,26,0.55), inset -3px -3px 6px rgba(0,0,0,0.35);
    transition:none;
  }
  .ball::before,.ball::after{
    content:""; position:absolute; inset:0; border-radius:50%;
    border:1.5px solid rgba(10,10,10,0.45);
  }
  .ball::before{clip-path:inset(0 0 0 48%);}
  .result-flash{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:30px; font-weight:900; letter-spacing:2px;
    opacity:0; pointer-events:none;
    text-shadow:0 0 20px currentColor;
  }

  .meter-track{
    position:relative;
    height:34px;
    border-radius:10px;
    background:#070b12;
    border:1px solid var(--line);
    overflow:hidden;
    margin-bottom:6px;
  }
  .zone{position:absolute; top:0; bottom:0;}
  .zone.ok{background:rgba(56,255,171,0.18); border-left:1px solid rgba(56,255,171,0.5); border-right:1px solid rgba(56,255,171,0.5);}
  .zone.perfect{background:rgba(45,227,255,0.35); border-left:1px solid var(--cyan); border-right:1px solid var(--cyan); box-shadow:0 0 12px rgba(45,227,255,0.5) inset;}
  .cursor{
    position:absolute; top:-3px; bottom:-3px; width:4px;
    background:var(--text);
    box-shadow:0 0 10px rgba(255,255,255,0.8);
    border-radius:2px;
  }
  .meter-label{
    display:flex; justify-content:space-between; font-size:10px; color:var(--dim);
    letter-spacing:1px; margin-bottom:16px;
  }

  button#shootBtn{
    width:100%;
    padding:16px;
    font-size:16px;
    font-weight:800;
    letter-spacing:2px;
    border-radius:12px;
    border:1px solid rgba(45,227,255,0.4);
    background:linear-gradient(180deg, rgba(45,227,255,0.18), rgba(45,227,255,0.04));
    color:var(--cyan);
    cursor:pointer;
    text-shadow:0 0 10px rgba(45,227,255,0.6);
    transition:transform 0.08s ease, background 0.15s ease;
  }
  button#shootBtn:active{transform:scale(0.97); background:rgba(45,227,255,0.3);}
  button#shootBtn:disabled{opacity:0.4; cursor:default;}

  .msg{
    text-align:center; font-size:12px; color:var(--dim); margin-top:12px; letter-spacing:0.5px; min-height:16px;
  }

  .lives{display:flex; gap:6px;}
  .life{width:9px; height:9px; border-radius:50%; background:var(--red); box-shadow:0 0 6px var(--red);}
  .life.off{background:#23303f; box-shadow:none;}

  .overlay{
    position:absolute; inset:0; background:rgba(4,6,10,0.92);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; border-radius:18px; z-index:10;
    opacity:0; pointer-events:none; transition:opacity 0.3s ease;
  }
  .overlay.show{opacity:1; pointer-events:auto;}
  .overlay h2{margin:0; color:var(--red); letter-spacing:3px; font-size:22px; text-shadow:0 0 16px rgba(255,59,92,0.7);}
  .overlay p{margin:0; color:var(--dim); font-size:13px;}
  .overlay button{
    margin-top:8px; padding:10px 22px; border-radius:10px; border:1px solid var(--orange);
    background:rgba(255,122,26,0.12); color:var(--orange); font-weight:700; letter-spacing:1px;
    cursor:pointer;
  }

  @media (max-width:380px){
    .court{height:200px;}
    .logo{font-size:12px;}
    .stats b{font-size:16px;}
  }
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="wrap">
  <div class="frame">
    <header>
      <div class="logo">BUZZER<span>//</span>CLUTCH</div>
      <div class="stats">
        <div class="score"><b id="scoreVal">0</b>SCORE</div>
        <div class="hi"><b id="hiVal">0</b>BEST</div>
      </div>
    </header>

    <div class="court" id="court">
      <div class="hoop">
        <div class="rim"></div>
        <div class="net"></div>
      </div>
      <div class="ball" id="ball"></div>
      <div class="result-flash" id="flash"></div>
      <div class="overlay" id="overlay">
        <h2>GAME OVER</h2>
        <p id="finalScore">Score: 0 &middot; Best: 0</p>
        <button id="retryBtn">RETRY</button>
      </div>
    </div>

    <div class="meter-track" id="meterTrack">
      <div class="zone ok" id="zoneOk"></div>
      <div class="zone perfect" id="zonePerfect"></div>
      <div class="cursor" id="cursor"></div>
    </div>
    <div class="meter-label">
      <span>AIR BALL</span>
      <span>SWISH</span>
      <span>AIR BALL</span>
    </div>

    <button id="shootBtn">SHOOT</button>
    <div class="msg" id="msg">Tap SHOOT to launch the meter, tap again to release.</div>
    <div class="lives" id="lives" style="justify-content:center; margin-top:12px;"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var track = document.getElementById('meterTrack');
  var cursor = document.getElementById('cursor');
  var zoneOk = document.getElementById('zoneOk');
  var zonePerfect = document.getElementById('zonePerfect');
  var shootBtn = document.getElementById('shootBtn');
  var msg = document.getElementById('msg');
  var ball = document.getElementById('ball');
  var flash = document.getElementById('flash');
  var scoreVal = document.getElementById('scoreVal');
  var hiVal = document.getElementById('hiVal');
  var overlay = document.getElementById('overlay');
  var finalScore = document.getElementById('finalScore');
  var retryBtn = document.getElementById('retryBtn');
  var livesEl = document.getElementById('lives');

  var LIVES_MAX = 3;
  var state = {
    score: 0,
    hi: 0,
    lives: LIVES_MAX,
    pos: 0,
    dir: 1,
    running: false,
    animId: null,
    speed: 1.6,
    phase: 'idle' // idle -> charging -> done
  };

  try { state.hi = parseInt(localStorage.getItem('buzzerClutchHi') || '0', 10) || 0; } catch(e){}
  hiVal.textContent = state.hi;

  function layoutZones(){
    var w = track.clientWidth;
    var perfectW = 46;
    var okW = 110;
    var perfectLeft = w/2 - perfectW/2;
    var okLeft = w/2 - okW/2;
    zonePerfect.style.left = perfectLeft + 'px';
    zonePerfect.style.width = perfectW + 'px';
    zoneOk.style.left = okLeft + 'px';
    zoneOk.style.width = okW + 'px';
  }
  window.addEventListener('resize', layoutZones);
  layoutZones();

  function renderLives(){
    livesEl.innerHTML = '';
    for(var i=0;i<LIVES_MAX;i++){
      var d = document.createElement('div');
      d.className = 'life' + (i < state.lives ? '' : ' off');
      livesEl.appendChild(d);
    }
  }
  renderLives();

  function setBallHeight(t){
    // t: 0 (hoop) .. 1 (bottom)
    var courtH = document.getElementById('court').clientHeight;
    var topMin = 46, topMax = courtH - 48;
    ball.style.bottom = (courtH - (topMin + t*(topMax-topMin)) - 34) + 'px';
  }
  setBallHeight(1);

  function tick(){
    state.pos += state.dir * state.speed;
    var w = track.clientWidth;
    if(state.pos >= w - 2){ state.pos = w - 2; state.dir = -1; }
    if(state.pos <= 2){ state.pos = 2; state.dir = 1; }
    cursor.style.left = state.pos + 'px';
    state.animId = requestAnimationFrame(tick);
  }

  function startCharge(){
    if(state.phase !== 'idle') return;
    state.phase = 'charging';
    state.pos = 2;
    state.dir = 1;
    cursor.style.left = '2px';
    shootBtn.textContent = 'RELEASE';
    msg.textContent = 'Release in the glowing zone!';
    state.animId = requestAnimationFrame(tick);
  }

  function release(){
    if(state.phase !== 'charging') return;
    state.phase = 'done';
    cancelAnimationFrame(state.animId);

    var w = track.clientWidth;
    var center = w/2;
    var dist = Math.abs(state.pos - center);
    var result, points, color, ballTarget;

    if(dist <= 23){
      result = 'SWISH!'; points = 3; color = 'var(--cyan)'; ballTarget = 0;
    } else if(dist <= 55){
      result = 'GOOD!'; points = 2; color = 'var(--green)'; ballTarget = 0.12;
    } else {
      result = 'MISS'; points = 0; color = 'var(--red)'; ballTarget = 0.85;
    }

    animateBall(ballTarget, function(){
      flash.style.color = color;
      flash.textContent = result;
      flash.style.transition = 'none';
      flash.style.opacity = '1';
      flash.style.transform = 'scale(0.8)';
      requestAnimationFrame(function(){
        flash.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
        flash.style.transform = 'scale(1.05)';
      });
      setTimeout(function(){ flash.style.opacity = '0'; }, 650);

      if(points > 0){
        state.score += points;
        scoreVal.textContent = state.score;
        if(state.score > state.hi){
          state.hi = state.score;
          hiVal.textContent = state.hi;
          try { localStorage.setItem('buzzerClutchHi', String(state.hi)); } catch(e){}
        }
        msg.textContent = result + '  +' + points;
        state.speed = Math.min(3.2, state.speed + 0.12);
      } else {
        state.lives -= 1;
        renderLives();
        msg.textContent = 'Air ball. ' + state.lives + ' chance(s) left.';
      }

      setTimeout(function(){
        if(state.lives <= 0){
          endGame();
        } else {
          resetBall();
        }
      }, 700);
    });
  }

  function animateBall(target, cb){
    var start = 1, t0 = performance.now(), dur = 260;
    function step(now){
      var p = Math.min(1, (now - t0)/dur);
      var eased = 1 - Math.pow(1-p, 2);
      setBallHeight(start + (target-start)*eased);
      if(p < 1){ requestAnimationFrame(step); } else { cb && cb(); }
    }
    requestAnimationFrame(step);
  }

  function resetBall(){
    setBallHeight(1);
    state.phase = 'idle';
    shootBtn.textContent = 'SHOOT';
    msg.textContent = 'Tap SHOOT to launch the meter, tap again to release.';
  }

  function endGame(){
    finalScore.textContent = 'Score: ' + state.score + ' · Best: ' + state.hi;
    overlay.classList.add('show');
  }

  function resetGame(){
    state.score = 0;
    state.lives = LIVES_MAX;
    state.speed = 1.6;
    scoreVal.textContent = '0';
    renderLives();
    overlay.classList.remove('show');
    resetBall();
  }

  shootBtn.addEventListener('click', function(){
    if(state.phase === 'idle') startCharge();
    else if(state.phase === 'charging') release();
  });

  retryBtn.addEventListener('click', resetGame);

  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
})();
</script>
</body>
</html>
