<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Deep Field &mdash; Signal Array</title>
<style>
  :root{
    --bg:#05060a;
    --bg-2:#0a0e16;
    --panel:#0b0f18;
    --panel-2:#0d1220;
    --line:rgba(255,255,255,0.07);
    --accent:#ffb454;
    --accent-dim:#8a6a2e;
    --accent-soft:rgba(255,180,84,0.14);
    --accent-glow:rgba(255,180,84,0.45);
    --text:#dde3ec;
    --text-dim:#7c8798;
    --text-faint:#4b5566;
    --good:#5ad18f;
    --bad:#ff5d5d;
    --display: 'Segoe UI Semibold','Arial Narrow',Arial,sans-serif;
    --mono: 'Cascadia Code','SF Mono',Consolas,'Courier New',monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:var(--mono);
    overflow-x:hidden;
    position:relative;
  }
  canvas#starfield{
    position:fixed; inset:0; width:100%; height:100%; z-index:0; display:block;
  }
  .vignette{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(ellipse at 50% 40%, transparent 45%, rgba(0,0,0,0.55) 100%);
  }

  .app{
    position:relative; z-index:2;
    max-width:1180px; margin:0 auto;
    padding:22px 24px 48px;
    min-height:100vh;
  }

  header{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; flex-wrap:wrap;
    padding-bottom:16px; margin-bottom:22px;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand svg{width:30px;height:30px; flex:0 0 30px; filter:drop-shadow(0 0 6px var(--accent-glow));}
  .brand-text{font-family:var(--display); font-weight:700; font-size:19px; letter-spacing:3px; color:var(--text);}
  .brand-sub{display:block; font-family:var(--mono); font-weight:400; font-size:10px; letter-spacing:4px; color:var(--accent-dim); margin-top:3px;}
  .status{display:flex; align-items:center; gap:9px; font-size:11px; letter-spacing:2px; color:var(--text-dim);}
  .status-dot{width:8px; height:8px; border-radius:50%; background:var(--good); box-shadow:0 0 8px var(--good); animation:blink 2.4s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1;} 50%{opacity:0.35;}}

  main.grid{
    display:grid;
    grid-template-columns: 1.05fr 0.95fr;
    gap:26px;
    align-items:start;
  }
  @media (max-width:880px){
    main.grid{grid-template-columns:1fr;}
  }

  section.panel{
    background:linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--line);
    border-radius:4px;
    padding:22px;
    position:relative;
  }

  /* --------- viewer --------- */
  .viewer-frame{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    max-width:340px;
    margin:0 auto 20px;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px),
      radial-gradient(circle at 50% 50%, #0d1420, #04060a 78%);
    border-radius:2px;
  }
  .viewer-frame canvas{position:absolute; inset:0; width:100%; height:100%;}
  .corner{position:absolute; width:16px; height:16px; border-color:var(--accent-dim); opacity:0.8;}
  .corner.tl{top:-1px; left:-1px; border-top:2px solid; border-left:2px solid;}
  .corner.tr{top:-1px; right:-1px; border-top:2px solid; border-right:2px solid;}
  .corner.bl{bottom:-1px; left:-1px; border-bottom:2px solid; border-left:2px solid;}
  .corner.br{bottom:-1px; right:-1px; border-bottom:2px solid; border-right:2px solid;}

  .scan-overlay{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; background:rgba(5,6,10,0.72); backdrop-filter:none;
    opacity:0; pointer-events:none; transition:opacity .35s ease;
  }
  .scan-overlay.active{opacity:1;}
  .scan-text{font-size:11px; letter-spacing:3px; color:var(--accent); text-transform:uppercase;}
  .scan-bar{width:70%; height:3px; background:rgba(255,255,255,0.08); border-radius:2px; overflow:hidden;}
  .scan-bar-fill{height:100%; width:0%; background:var(--accent); box-shadow:0 0 8px var(--accent-glow);}

  .gen-btn{
    display:block; width:100%;
    background:var(--accent-soft);
    border:1px solid var(--accent-dim);
    color:var(--accent);
    font-family:var(--display); font-weight:700; font-size:13px; letter-spacing:3px;
    padding:14px 18px; border-radius:3px; cursor:pointer;
    transition:background .18s ease, box-shadow .18s ease, transform .08s ease, color .18s ease;
    text-transform:uppercase;
  }
  .gen-btn:hover{background:var(--accent); color:#1a1304; box-shadow:0 0 22px var(--accent-glow);}
  .gen-btn:active{transform:scale(0.98);}
  .gen-btn:disabled{opacity:0.55; cursor:progress;}

  .meter-row{display:flex; align-items:center; gap:10px; margin-top:16px; font-size:10.5px; letter-spacing:1.5px; color:var(--text-dim);}
  .meter{flex:1; height:6px; background:rgba(255,255,255,0.07); border-radius:3px; overflow:hidden;}
  .meter-fill{height:100%; width:0%; background:linear-gradient(90deg, var(--bad), var(--accent), var(--good)); background-size:300% 100%; transition:width 1s cubic-bezier(.2,.8,.2,1), background-position 1s ease;}
  .meter-val{width:34px; text-align:right; color:var(--text);}

  /* --------- data panel --------- */
  #designation{
    font-family:var(--display); font-size:24px; letter-spacing:1px; color:var(--text);
    margin:0 0 4px;
  }
  #designation b{color:var(--accent); font-weight:700;}
  .subtitle{font-size:11px; letter-spacing:2px; color:var(--text-dim); text-transform:uppercase; margin-bottom:18px;}

  .data-grid{display:grid; grid-template-columns:1fr 1fr; gap:0; border-top:1px solid var(--line); margin-bottom:18px;}
  .data-row{
    padding:9px 2px; border-bottom:1px solid var(--line);
    display:flex; flex-direction:column; gap:2px;
    opacity:0; transform:translateY(4px);
    animation:rowin .4s ease forwards;
  }
  @keyframes rowin{to{opacity:1; transform:translateY(0);}}
  .data-row .label{font-size:9.5px; letter-spacing:1.5px; color:var(--text-faint); text-transform:uppercase;}
  .data-row .value{font-size:13px; color:var(--text);}
  .data-row .value.accent{color:var(--accent);}

  .log-section h3, .history h3{
    font-family:var(--display); font-size:10.5px; letter-spacing:2.5px; color:var(--text-dim);
    text-transform:uppercase; margin:0 0 8px; padding-bottom:6px; border-bottom:1px solid var(--line);
  }
  #logText{font-size:12.5px; line-height:1.7; color:var(--text); min-height:60px;}

  .history{margin-top:20px;}
  #historyList{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:1px;}
  #historyList li{
    display:flex; justify-content:space-between; gap:10px;
    font-size:11px; padding:7px 8px; border-radius:2px;
    color:var(--text-dim); transition:background .15s ease, color .15s ease;
  }
  #historyList li:hover{background:rgba(255,255,255,0.04); color:var(--text);}
  #historyList li .h-id{color:var(--text); letter-spacing:0.5px;}
  #historyList li .h-type{color:var(--accent-dim); text-transform:uppercase; letter-spacing:1px; font-size:9.5px;}

  footer{text-align:center; margin-top:36px; font-size:10px; letter-spacing:2px; color:var(--text-faint);}

  @media (max-width:520px){
    .data-grid{grid-template-columns:1fr;}
    #designation{font-size:20px;}
  }
</style>
</head>
<body>

<canvas id="starfield"></canvas>
<div class="vignette"></div>

<div class="app">
  <header>
    <div class="brand">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="6" fill="#ffb454"/>
        <circle cx="24" cy="24" r="14" stroke="#ffb454" stroke-width="1.4" opacity="0.6"/>
        <circle cx="24" cy="24" r="21" stroke="#ffb454" stroke-width="1" opacity="0.3"/>
        <circle cx="24" cy="3" r="2" fill="#ffb454"/>
      </svg>
      <span class="brand-text">DEEP FIELD<span class="brand-sub">EXOPLANET SIGNAL ARRAY</span></span>
    </div>
    <div class="status"><span class="status-dot"></span>ARRAY ONLINE</div>
  </header>

  <main class="grid">
    <section class="panel">
      <div class="viewer-frame" id="viewerFrame">
        <canvas id="planetCanvas" width="340" height="340"></canvas>
        <div class="scan-overlay active" id="scanOverlay">
          <div class="scan-text" id="scanText">NO SIGNAL LOCKED</div>
          <div class="scan-bar"><div class="scan-bar-fill" id="scanFill"></div></div>
        </div>
        <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
      </div>
      <button class="gen-btn" id="genBtn">Triangulate Signal</button>
      <div class="meter-row">
        <span>HABITABILITY</span>
        <div class="meter"><div class="meter-fill" id="habFill"></div></div>
        <span class="meter-val" id="habVal">&mdash;</span>
      </div>
    </section>

    <section class="panel">
      <h2 id="designation">&mdash; AWAITING SIGNAL &mdash;</h2>
      <div class="subtitle" id="subtitle">No transmission locked</div>
      <div class="data-grid" id="dataGrid"></div>
      <div class="log-section">
        <h3>Transmission Log</h3>
        <div id="logText">Press <b style="color:var(--accent)">Triangulate Signal</b> to sweep the array and lock onto a new world.</div>
      </div>
      <div class="history">
        <h3>Recent Signals</h3>
        <ul id="historyList"></ul>
      </div>
    </section>
  </main>

  <footer>DEEP FIELD ARRAY &middot; PROCEDURAL TELEMETRY &middot; NO TWO SIGNALS ALIKE</footer>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- utils ---------------- */
  const rand=(a,b)=>Math.random()*(b-a)+a;
  const randInt=(a,b)=>Math.floor(rand(a,b+1));
  const choice=(arr)=>arr[Math.floor(Math.random()*arr.length)];
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const lerp=(a,b,t)=>a+(b-a)*t;

  function hexToRgb(hex){
    hex=hex.replace('#','');
    const n=parseInt(hex,16);
    return [(n>>16)&255,(n>>8)&255,n&255];
  }
  function rgbStr(rgb,a){ return 'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+(a===undefined?1:a)+')'; }
  function lerpColor(hexA,hexB,t){
    const a=hexToRgb(hexA), b=hexToRgb(hexB);
    return [Math.round(lerp(a[0],b[0],t)),Math.round(lerp(a[1],b[1],t)),Math.round(lerp(a[2],b[2],t))];
  }

  /* ---------------- starfield background ---------------- */
  const sfCanvas=document.getElementById('starfield');
  const sfCtx=sfCanvas.getContext('2d');
  let stars=[];
  function sizeStarfield(){
    sfCanvas.width=window.innerWidth;
    sfCanvas.height=window.innerHeight;
    const count=Math.round((sfCanvas.width*sfCanvas.height)/9000);
    stars=[];
    for(let i=0;i<count;i++){
      stars.push({
        x:Math.random()*sfCanvas.width,
        y:Math.random()*sfCanvas.height,
        r:Math.random()*1.3+0.2,
        phase:Math.random()*Math.PI*2,
        speed:rand(0.4,1.4)
      });
    }
  }
  function drawStarfield(t){
    sfCtx.clearRect(0,0,sfCanvas.width,sfCanvas.height);
    sfCtx.fillStyle='#05060a';
    sfCtx.fillRect(0,0,sfCanvas.width,sfCanvas.height);
    for(const s of stars){
      const a=0.35+0.65*Math.abs(Math.sin(t*0.0006*s.speed+s.phase));
      sfCtx.beginPath();
      sfCtx.fillStyle='rgba(220,230,255,'+a.toFixed(3)+')';
      sfCtx.arc(s.x,s.y,s.r,0,Math.PI*2);
      sfCtx.fill();
    }
  }
  window.addEventListener('resize', sizeStarfield);
  sizeStarfield();

  /* ---------------- audio (synthesized, no files) ---------------- */
  let actx=null;
  function audio(){ if(!actx){ actx=new (window.AudioContext||window.webkitAudioContext)(); } return actx; }
  function tone(freqFrom,freqTo,dur,vol,type,delay){
    try{
      const ctx=audio();
      const start=ctx.currentTime+(delay||0);
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.type=type||'sine';
      osc.frequency.setValueAtTime(freqFrom,start);
      osc.frequency.exponentialRampToValueAtTime(Math.max(freqTo,1),start+dur);
      gain.gain.setValueAtTime(0,start);
      gain.gain.linearRampToValueAtTime(vol,start+0.02);
      gain.gain.exponentialRampToValueAtTime(0.001,start+dur);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(start); osc.stop(start+dur+0.02);
    }catch(e){}
  }
  function playSweep(){ tone(1400,260,0.5,0.05,'sine',0); }
  function playLock(){ tone(440,440,0.12,0.08,'triangle',0); tone(660,660,0.18,0.07,'triangle',0.1); }

  /* ---------------- data tables ---------------- */
  const STAR_TYPES=[
    {cls:'M',name:'Red Dwarf',color:['#ff6b4a','#c2381c'],temp:[2400,3700]},
    {cls:'K',name:'Orange Dwarf',color:['#ffa94a','#d97a1f'],temp:[3700,5200]},
    {cls:'G',name:'Yellow Dwarf',color:['#fff1a8','#ffd34d'],temp:[5200,6000]},
    {cls:'F',name:'Yellow-White',color:['#fff8e7','#fff0b8'],temp:[6000,7500]},
    {cls:'A',name:'White Star',color:['#eaf2ff','#cfe0ff'],temp:[7500,10000]},
    {cls:'B',name:'Blue-White Giant',color:['#bcd9ff','#8fb8ff'],temp:[10000,22000]}
  ];

  const PLANET_TYPES=[
    {id:'scorched',label:'Scorched Rock',palette:['#5a2a1d','#8c4a2a','#c77b3f'],ring:0.05,moons:[0,1],atmo:'Trace, none',temp:[400,900],hab:3,style:'cratered'},
    {id:'molten',label:'Molten World',palette:['#1c0704','#8a1f10','#ff7a2a'],ring:0.04,moons:[0,1],atmo:'Sulfurous ash',temp:[700,1500],hab:1,style:'molten',glow:true},
    {id:'barren',label:'Barren Moonscape',palette:['#4c4a47','#847f78','#b8b2a6'],ring:0.04,moons:[0,2],atmo:'None',temp:[-80,120],hab:8,style:'cratered'},
    {id:'tundra',label:'Frozen Tundra',palette:['#6f8792','#9fc0cc','#eef6f8'],ring:0.1,moons:[0,2],atmo:'Thin nitrogen',temp:[-160,-20],hab:22,style:'banded'},
    {id:'ocean',label:'Pelagic Ocean World',palette:['#06283c','#157a9e','#8be6ef'],ring:0.05,moons:[0,2],atmo:'Nitrogen-oxygen',temp:[-5,38],hab:68,style:'marbled'},
    {id:'terrestrial',label:'Terrestrial',palette:['#123d24','#3f8a4a','#cdbd84'],ring:0.04,moons:[0,2],atmo:'Nitrogen-oxygen',temp:[-15,42],hab:78,style:'marbled'},
    {id:'toxic',label:'Toxic Atmosphere',palette:['#3b2f08','#8a7a1f','#d9e05a'],ring:0.1,moons:[0,1],atmo:'Methane-ammonia haze',temp:[-60,70],hab:9,style:'banded'},
    {id:'icegiant',label:'Ice Giant',palette:['#122a4d','#2e5f9e','#9fd3f0'],ring:0.45,moons:[1,5],atmo:'Hydrogen-helium-methane',temp:[-230,-190],hab:2,style:'banded'},
    {id:'gasgiant',label:'Gas Giant',palette:['#3f2a10','#9c6a2e','#f0cf9a'],ring:0.65,moons:[1,6],atmo:'Hydrogen-helium',temp:[-170,-110],hab:1,style:'banded'}
  ];

  const PREFIXES=['KOI','TOI','HD','GJ','WASP','K2','TRAPPIST','KEPLER','PROX','HIP','LHS'];

  const NARRATIVES={
    scorched:[
      "Thermal imaging shows a dayside baked to slag; the array caught nothing but heat shimmer and static.",
      "Surface cracked into a mosaic of ash plains. Any atmosphere here burned off eons before we listened."
    ],
    molten:[
      "Still forming, or still dying — the surface glows in open rivers of rock visible from orbit.",
      "Spectral lines flicker with outgassing. This one hasn't decided what kind of world it wants to be yet."
    ],
    barren:[
      "A quiet, airless stone. No weather, no erosion — every crater here is exactly as old as it looks.",
      "Dust and silence. The kind of world that keeps its history on the surface instead of burying it."
    ],
    tundra:[
      "Pale ice fields stretch pole to pole under a thin, cold sky. Nothing moves here in any hurry.",
      "Frozen solid under a weak sun. Whatever atmosphere remains clings low, close to the ground."
    ],
    ocean:[
      "No continents found — just one planet-wide sea under a hazy, breathable-looking sky.",
      "Tidal signatures suggest a large moon nearby. The whole surface is water, as far as we can tell."
    ],
    terrestrial:[
      "Green-brown continents, blue oceans, a nitrogen-oxygen sky. Uncomfortably familiar, honestly.",
      "A balanced world — weather systems, seasons, and a surface that looks built for something to live on it."
    ],
    toxic:[
      "A thick yellow haze hides the surface entirely. Nothing on our instruments wants to breathe this.",
      "Chemistry over here got complicated fast. The clouds alone would strip paint back home."
    ],
    icegiant:[
      "Deep blue bands of methane cloud wrap a planet far larger than anything rocky.",
      "Cold, quiet, enormous. Its moons outnumber the fingers on one hand and then some."
    ],
    gasgiant:[
      "A banded giant, storms the size of continents dragging slowly around its equator.",
      "No surface to speak of — just pressure, depth, and a retinue of moons holding orbit around it."
    ]
  };

  /* ---------------- generation ---------------- */
  let historyData=[];

  function genDesignation(position){
    const prefix=choice(PREFIXES);
    const num=randInt(100,88999);
    const letter=String.fromCharCode(98+clamp(position-1,0,7));
    return {full:prefix+'-'+num+' '+letter, star:prefix+'-'+num};
  }

  function buildSystem(){
    const star=choice(STAR_TYPES);
    const starTemp=randInt(star.temp[0],star.temp[1]);
    const type=choice(PLANET_TYPES);
    const totalPlanets=randInt(1,8);
    const position=randInt(1,totalPlanets);
    const des=genDesignation(position);
    const hasRings=Math.random()<type.ring;
    const moonCount=randInt(type.moons[0],type.moons[1]);
    const isGiant=(type.id==='gasgiant'||type.id==='icegiant');
    const radiusEarth=isGiant?rand(3.2,12.5):rand(0.35,1.9);
    const massEarth=isGiant?Math.pow(radiusEarth,2.3)*rand(0.7,1.1):Math.pow(radiusEarth,2.9)*rand(0.75,1.2);
    const orbitAU=rand(0.03,6.5);
    const orbitPeriodDays=Math.max(4,Math.round(Math.pow(orbitAU,1.5)*365));
    const periodLabel=orbitPeriodDays>500?(orbitPeriodDays/365.25).toFixed(1)+' yr':orbitPeriodDays+' d';
    const surfaceTemp=randInt(type.temp[0],type.temp[1]);
    let hab=type.hab;
    hab-=Math.min(40,Math.abs(surfaceTemp-16)/2);
    hab+=rand(-6,6);
    hab=Math.round(clamp(hab,0,100));
    const narrative=choice(NARRATIVES[type.id]).replace(/\{star\}/g,des.star);

    return {
      designation:des.full, starName:des.star, star, starTemp, type, totalPlanets, position,
      hasRings, moonCount, radiusEarth, massEarth, orbitAU, periodLabel, surfaceTemp, hab, narrative
    };
  }

  function buildVisual(sys){
    const t=sys.type;
    const seed={
      palette:t.palette,
      style:t.style,
      glow:!!t.glow,
      blotches:[],
      bandOffsets:[],
      rings: sys.hasRings ? { tilt:rand(0.28,0.42), colorIdx: 1, alpha:rand(0.35,0.55), widthMul:rand(1.5,2.1) } : null,
      moons: []
    };
    if(t.style==='banded'){
      const bands=randInt(6,10);
      for(let i=0;i<bands;i++){
        seed.bandOffsets.push({ y:(i/bands), thick:rand(0.6,1.6)/bands, cShift:rand(-0.25,0.25), speed:rand(0.15,0.4)*(i%2?1:-1) });
      }
    } else {
      const count = t.style==='marbled'? randInt(10,16) : randInt(14,22);
      for(let i=0;i<count;i++){
        seed.blotches.push({
          a:rand(0,Math.PI*2), d:rand(0,0.92), size:rand(0.08,0.26),
          shade:rand(-0.3,0.35), drift:rand(0.02,0.06)*(Math.random()<0.5?1:-1)
        });
      }
    }
    for(let i=0;i<sys.moonCount;i++){
      seed.moons.push({ dist:0.62+ i*0.17 + rand(0,0.05), size:rand(0.035,0.07), speed:rand(0.25,0.55)*(Math.random()<0.5?1:-1), phase:rand(0,Math.PI*2) });
    }
    return seed;
  }

  /* ---------------- planet renderer ---------------- */
  const pCanvas=document.getElementById('planetCanvas');
  const pCtx=pCanvas.getContext('2d');
  let currentVisual=null;
  let rotation=0;

  function drawPlanet(time){
    const w=pCanvas.width, h=pCanvas.height;
    pCtx.clearRect(0,0,w,h);
    if(!currentVisual) return;
    const cx=w/2, cy=h/2, R=w*0.30;
    const v=currentVisual;
    rotation += 0.0022;

    // rings behind
    if(v.rings){
      drawRing(cx,cy,R,v,true);
    }

    // planet base sphere
    pCtx.save();
    pCtx.beginPath();
    pCtx.arc(cx,cy,R,0,Math.PI*2);
    pCtx.clip();

    const base=lerpColor(v.palette[0],v.palette[1],0.5);
    const grad=pCtx.createRadialGradient(cx-R*0.4,cy-R*0.4,R*0.1,cx,cy,R*1.15);
    grad.addColorStop(0, rgbStr(hexToRgb(v.palette[2]||v.palette[1]),1));
    grad.addColorStop(0.55, rgbStr(hexToRgb(v.palette[1]),1));
    grad.addColorStop(1, rgbStr(hexToRgb(v.palette[0]),1));
    pCtx.fillStyle=grad;
    pCtx.fillRect(cx-R,cy-R,R*2,R*2);

    if(v.style==='banded'){
      for(const b of v.bandOffsets){
        const yy=cy - R + b.y*R*2 + Math.sin(rotation*2+b.y*8)*2;
        const thick=b.thick*R*2;
        const c=hexToRgb(b.cShift>0?v.palette[2]||v.palette[1]:v.palette[0]);
        pCtx.fillStyle=rgbStr(c,0.22+Math.abs(b.cShift));
        pCtx.beginPath();
        pCtx.ellipse(cx, yy, R*1.05, Math.max(2,thick/2), 0, 0, Math.PI*2);
        pCtx.fill();
      }
    } else {
      for(const bl of v.blotches){
        const ang=bl.a + rotation*bl.drift*6;
        const dist=bl.d*R;
        const x=cx+Math.cos(ang)*dist;
        const y=cy+Math.sin(ang)*dist*0.92;
        const size=bl.size*R;
        const col=bl.shade>0?hexToRgb(v.palette[2]||v.palette[1]):hexToRgb(v.palette[0]);
        pCtx.fillStyle=rgbStr(col, 0.28+Math.abs(bl.shade));
        pCtx.beginPath();
        pCtx.ellipse(x,y,size,size*0.78,ang,0,Math.PI*2);
        pCtx.fill();
      }
    }

    // shading (terminator)
    const shade=pCtx.createRadialGradient(cx-R*0.35,cy-R*0.35,R*0.2,cx+R*0.2,cy+R*0.2,R*1.3);
    shade.addColorStop(0,'rgba(0,0,0,0)');
    shade.addColorStop(1,'rgba(0,0,0,0.55)');
    pCtx.fillStyle=shade;
    pCtx.fillRect(cx-R,cy-R,R*2,R*2);

    if(v.glow){
      pCtx.fillStyle='rgba(255,120,40,0.18)';
      pCtx.beginPath(); pCtx.arc(cx,cy,R,0,Math.PI*2); pCtx.fill();
    }
    pCtx.restore();

    // atmosphere rim
    pCtx.beginPath();
    pCtx.arc(cx,cy,R+2,0,Math.PI*2);
    pCtx.lineWidth=4;
    pCtx.strokeStyle='rgba(255,255,255,0.10)';
    pCtx.stroke();

    if(v.rings){
      drawRing(cx,cy,R,v,false);
    }

    // moons
    for(const m of v.moons){
      const ang = time*0.00035*m.speed + m.phase;
      const mx=cx+Math.cos(ang)*R*(1+m.dist);
      const my=cy+Math.sin(ang)*R*(1+m.dist)*0.4;
      pCtx.beginPath();
      pCtx.fillStyle='rgba(200,210,225,0.9)';
      pCtx.arc(mx,my,Math.max(2,m.size*R),0,Math.PI*2);
      pCtx.fill();
    }
  }

  function drawRing(cx,cy,R,v,behind){
    const r=v.rings;
    const rx=R*2.0, ry=R*2.0*r.tilt;
    pCtx.save();
    pCtx.beginPath();
    if(behind){
      pCtx.rect(cx-rx-10, cy-ry-10, (rx+10)*2, ry+10);
    } else {
      pCtx.rect(cx-rx-10, cy, (rx+10)*2, ry+10);
    }
    pCtx.clip();
    pCtx.strokeStyle=rgbStr(hexToRgb(v.palette[2]||v.palette[1]), r.alpha);
    pCtx.lineWidth=R*0.16*r.widthMul;
    pCtx.beginPath();
    pCtx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);
    pCtx.stroke();
    pCtx.strokeStyle=rgbStr(hexToRgb(v.palette[0]), r.alpha*0.6);
    pCtx.lineWidth=R*0.05;
    pCtx.beginPath();
    pCtx.ellipse(cx,cy,rx*0.86,ry*0.86,0,0,Math.PI*2);
    pCtx.stroke();
    pCtx.restore();
  }

  function loop(t){
    drawStarfield(t);
    drawPlanet(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ---------------- UI wiring ---------------- */
  const genBtn=document.getElementById('genBtn');
  const scanOverlay=document.getElementById('scanOverlay');
  const scanText=document.getElementById('scanText');
  const scanFill=document.getElementById('scanFill');
  const designationEl=document.getElementById('designation');
  const subtitleEl=document.getElementById('subtitle');
  const dataGrid=document.getElementById('dataGrid');
  const logText=document.getElementById('logText');
  const habFill=document.getElementById('habFill');
  const habVal=document.getElementById('habVal');
  const historyList=document.getElementById('historyList');

  function row(label,value,accent){
    return '<div class="data-row"><span class="label">'+label+'</span><span class="value'+(accent?' accent':'')+'">'+value+'</span></div>';
  }

  function renderData(sys){
    designationEl.innerHTML='SIGNAL <b>'+sys.designation+'</b>';
    subtitleEl.textContent=sys.type.label.toUpperCase()+' — ORBITING A CLASS '+sys.star.cls+' STAR';

    const rowsHtml=[
      row('Host Star', sys.starName+' ('+sys.star.name+')'),
      row('Spectral Class', sys.star.cls+' &middot; '+sys.starTemp+' K'),
      row('Orbital Position', sys.position+' of '+sys.totalPlanets+' planets'),
      row('Orbital Period', sys.periodLabel),
      row('Orbital Distance', sys.orbitAU.toFixed(2)+' AU'),
      row('Planet Radius', sys.radiusEarth.toFixed(2)+' R⊕'),
      row('Planet Mass', sys.massEarth.toFixed(2)+' M⊕'),
      row('Surface Temp', sys.surfaceTemp+' &deg;C'),
      row('Atmosphere', sys.type.atmo),
      row('Ring System', sys.hasRings?'Detected':'None'),
      row('Moons', sys.moonCount),
      row('Habitability Index', sys.hab+' / 100', true)
    ];
    dataGrid.innerHTML=rowsHtml.map((h,i)=>h.replace('class="data-row"','class="data-row" style="animation-delay:'+(i*45)+'ms"')).join('');

    logText.textContent=sys.narrative;

    habFill.style.width=sys.hab+'%';
    habFill.style.backgroundPosition=sys.hab+'% 0';
    habVal.textContent=sys.hab;

    historyData.unshift(sys);
    if(historyData.length>6) historyData.pop();
    historyList.innerHTML=historyData.map(function(h){
      return '<li><span class="h-id">'+h.designation+'</span><span class="h-type">'+h.type.label+'</span></li>';
    }).join('');
  }

  let scanning=false;
  function generate(){
    if(scanning) return;
    scanning=true;
    genBtn.disabled=true;
    genBtn.textContent='Scanning…';
    playSweep();
    scanOverlay.classList.add('active');
    scanFill.style.transition='none';
    scanFill.style.width='0%';
    const labels=['ACQUIRING CARRIER','FILTERING NOISE FLOOR','RESOLVING ORBIT','TRIANGULATING SIGNAL','LOCKING'];
    let step=0;
    scanText.textContent=labels[0];
    requestAnimationFrame(function(){
      scanFill.style.transition='width 0.9s cubic-bezier(.3,.7,.2,1)';
      scanFill.style.width='100%';
    });
    const stepTimer=setInterval(function(){
      step++;
      if(step<labels.length) scanText.textContent=labels[step];
    },180);

    setTimeout(function(){
      clearInterval(stepTimer);
      const sys=buildSystem();
      currentVisual=buildVisual(sys);
      renderData(sys);
      playLock();
      scanOverlay.classList.remove('active');
      genBtn.disabled=false;
      genBtn.textContent='Triangulate Signal';
      scanning=false;
    },900);
  }

  genBtn.addEventListener('click', generate);

})();
</script>
</body>
